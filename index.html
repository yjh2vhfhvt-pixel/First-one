<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mensch-Radar</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
    --sl: env(safe-area-inset-left, 0px);
    --sr: env(safe-area-inset-right, 0px);
  }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:sans-serif;
               -webkit-user-select:none; user-select:none; }
  video, canvas { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; }
  .hud { color:#0f0; background:rgba(0,0,0,.6); padding:6px 12px; border-radius:8px; }
  #info { position:fixed; z-index:2; top:calc(12px + var(--st)); left:calc(12px + var(--sl));
          display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  #heading { font-weight:bold; }
  #controls { position:fixed; z-index:2; top:calc(12px + var(--st)); right:calc(12px + var(--sr));
              display:flex; gap:8px; }
  #controls button { background:rgba(0,0,0,.6); color:#0f0; border:1px solid #0f0;
                     border-radius:8px; font-size:20px; width:44px; height:44px; cursor:pointer; }
  #controls button.off { color:#060; border-color:#060; }
  #legend { position:fixed; z-index:2; bottom:calc(12px + var(--sb)); left:calc(12px + var(--sl));
            display:flex; flex-direction:column; gap:4px; }
  #legend button { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.6);
                   color:#fff; border:none; border-radius:6px; padding:4px 8px; font-size:13px;
                   cursor:pointer; text-align:left; }
  #legend button.off { opacity:.35; text-decoration:line-through; }
  #legend .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  #legend .count { margin-left:auto; padding-left:8px; font-weight:bold; }
  #start { position:fixed; inset:0; z-index:3; background:rgba(0,0,0,.9); color:#0f0;
           font-size:22px; border:none; cursor:pointer; padding:24px; }
  #start small { display:block; margin-top:8px; font-size:15px; color:#0a0; }
  #start .tip { margin-top:28px; font-size:14px; color:#8c8; }
  #safe { position:fixed; visibility:hidden; padding-bottom:var(--sb); padding-right:var(--sr); }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="info">
  <div id="status" class="hud">Lade KI-Modell…</div>
  <div id="heading" class="hud" hidden></div>
</div>
<div id="controls" hidden>
  <button id="installBtn" title="Als App installieren" hidden>📲</button>
  <button id="soundBtn" title="Ton an/aus">🔊</button>
  <button id="vibBtn" title="Vibration an/aus">📳</button>
</div>
<div id="legend" hidden></div>
<button id="start" hidden>
  Radar starten
  <small>Kamera, Kompass &amp; Ton</small>
  <div class="tip" id="iosTip" hidden>Tipp: Über „Teilen“ → „Zum Home-Bildschirm“<br>wird das Radar zur App.</div>
</button>
<div id="safe"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video');
const canvas = $('overlay');
const ctx = canvas.getContext('2d');
const statusEl = $('status');
const headingEl = $('heading');
const startBtn = $('start');

// Erkannte Objektarten: Anzeigename, Farbe, typische Höhe in Metern (für die Entfernung)
// und Tonhöhe des Signals bei neuer Erkennung
const CLASSES = {
  person:     { name: 'Person',   rgb: '0,255,0',     height: 1.70, tone: 880 },
  car:        { name: 'Auto',     rgb: '0,200,255',   height: 1.50, tone: 440 },
  truck:      { name: 'LKW',      rgb: '60,120,255',  height: 3.20, tone: 330 },
  bus:        { name: 'Bus',      rgb: '170,120,255', height: 3.00, tone: 370 },
  bicycle:    { name: 'Fahrrad',  rgb: '255,230,0',   height: 1.10, tone: 1100 },
  motorcycle: { name: 'Motorrad', rgb: '255,150,0',   height: 1.20, tone: 990 },
  dog:        { name: 'Hund',     rgb: '255,80,80',   height: 0.60, tone: 1500 },
  cat:        { name: 'Katze',    rgb: '255,110,200', height: 0.30, tone: 1700 }
};
const color = (cls, a = 1) => `rgba(${CLASSES[cls].rgb}, ${a})`;

const LONG_FOV = 1.15;      // Blickwinkel über die lange Bildseite (ca. 66°, typische Handy-Hauptkamera)
const SWEEP_SPEED = 1.5;    // Drehgeschwindigkeit des Radarstrahls in Radiant/Sekunde
const FADE_TIME = 2.5;      // Sekunden, bis ein Punkt nach dem Strahl verblasst
const MIN_SCORE = 0.5;      // Mindest-Konfidenz einer Erkennung
const BOX_TIMEOUT = 500;    // ms, nach denen ein Rahmen ohne neue Erkennung verschwindet
const LOST_IN_VIEW = 2000;  // ms: im Sichtfeld, aber nicht mehr erkannt -> entfernen
const MEMORY_TIME = 30000;  // ms: außerhalb des Sichtfelds so lange merken
const ALERT_COOLDOWN = 1000;// ms zwischen zwei Signalen für neue Objekte
const RANGES = [10, 20, 50];// Radar-Reichweiten in Metern (Tippen aufs Radar wechselt)
const TAU = Math.PI * 2;

let model = null;
let blips = [];             // { id, cls, bearing, dist, clipped, lastSeen, lastHit }
let detections = [];        // aktuelle Erkennungen: { bbox, score, id, cls, dist, clipped }
let detectionsTime = 0;
let nextId = 1;
let sweep = 0;
let lastFrame = performance.now();
let fov = 1.0;              // aktueller horizontaler Blickwinkel, wird aus dem Videoformat berechnet
let radar = { x: 0, y: 0, R: 0 };

// Einstellungen (werden im Browser gemerkt)
const settings = Object.assign({
  sound: true,
  vibrate: 'vibrate' in navigator,
  range: 1,
  enabled: Object.keys(CLASSES)
}, load('radar-settings'));
function load(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } }
function save() { try { localStorage.setItem('radar-settings', JSON.stringify(settings)); } catch {} }
const isEnabled = cls => settings.enabled.includes(cls);

// Kompass: Blickrichtung der Kamera in Radiant (0 = Norden, im Uhrzeigersinn)
let heading = 0;
let hasCompass = false;
let hx = 0, hy = 1;         // geglätteter Richtungsvektor

let audio = null;
let lastAlert = 0;

// Winkel auf (-PI, PI] bringen
const wrap = a => ((a % TAU) + TAU + Math.PI) % TAU - Math.PI;
const fmtDist = d => (d < 10 ? d.toFixed(1).replace('.', ',') : Math.round(d)) + ' m';

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

async function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches
                     || navigator.standalone;
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !standalone) $('iosTip').hidden = false;

  try {
    model = await cocoSsd.load();
    statusEl.textContent = 'Bereit';
    startBtn.hidden = false;
  } catch (e) {
    statusEl.textContent = 'Fehler beim Laden: ' + e.message;
  }
}

/* ---------------- Installation als App ---------------- */

let installPrompt = null;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  $('installBtn').hidden = false;
});
$('installBtn').onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  $('installBtn').hidden = true;
};
addEventListener('appinstalled', () => $('installBtn').hidden = true);

// Bildschirm soll beim Radar-Betrieb nicht ausgehen
let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && video.srcObject) keepAwake();
});

/* ---------------- Kompass ---------------- */

// Richtung der Rückkamera aus alpha/beta/gamma (Formel aus der W3C-Spezifikation)
function cameraHeading(alpha, beta, gamma) {
  const a = alpha * Math.PI / 180, b = beta * Math.PI / 180, g = gamma * Math.PI / 180;
  const cX = Math.cos(b), cY = Math.cos(g), cZ = Math.cos(a);
  const sX = Math.sin(b), sY = Math.sin(g), sZ = Math.sin(a);
  const vx = -cZ * sY - sZ * sX * cY;
  const vy = -sZ * sY + cZ * sX * cY;
  return (Math.atan2(vx, vy) + TAU) % TAU;
}

function onOrientation(e) {
  let h;
  if (typeof e.webkitCompassHeading === 'number') {
    h = e.webkitCompassHeading * Math.PI / 180;           // iOS
  } else if (e.absolute && e.alpha != null) {
    h = cameraHeading(e.alpha, e.beta, e.gamma);         // Android
  } else {
    return;
  }
  hasCompass = true;
  // Glätten über Vektoren, damit der Sprung 359° -> 0° kein Problem ist
  hx += (Math.sin(h) - hx) * 0.2;
  hy += (Math.cos(h) - hy) * 0.2;
  heading = (Math.atan2(hx, hy) + TAU) % TAU;
}

async function startCompass() {
  // iOS 13+ verlangt eine Erlaubnis, die direkt im Klick angefragt werden muss
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    } catch { return; }
  }
  if ('ondeviceorientationabsolute' in window) {
    addEventListener('deviceorientationabsolute', onOrientation);
  } else {
    addEventListener('deviceorientation', onOrientation);
  }
}

function headingText() {
  const deg = Math.round(heading * 180 / Math.PI) % 360;
  const dirs = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'];
  return `${deg}° ${dirs[Math.round(deg / 45) % 8]}`;
}

/* ---------------- Ton & Vibration ---------------- */

function tone(freq, start, duration, volume) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(volume, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(gain).connect(audio.destination);
  osc.start(start);
  osc.stop(start + duration);
}

// Deutliches Doppel-Signal für ein neu erkanntes Objekt, Tonhöhe je nach Art
function alertNew(cls) {
  const now = performance.now();
  if (now - lastAlert < ALERT_COOLDOWN) return;
  lastAlert = now;
  if (settings.sound && audio) {
    const t = audio.currentTime, f = CLASSES[cls].tone;
    tone(f, t, 0.15, 0.4);
    tone(f * 1.5, t + 0.17, 0.25, 0.4);
  }
  if (settings.vibrate && 'vibrate' in navigator) navigator.vibrate([120, 60, 120]);
}

// Leiser Sonar-Ping, wenn der Strahl über ein Objekt streicht (nah = höher)
function sweepPing(dist) {
  if (!settings.sound || !audio) return;
  const near = 1 - Math.min(1, dist / RANGES[settings.range]);
  tone(600 + 600 * near, audio.currentTime, 0.3, 0.12);
}

function updateButtons() {
  $('soundBtn').textContent = settings.sound ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('off', !settings.sound);
  $('vibBtn').classList.toggle('off', !settings.vibrate);
  $('vibBtn').hidden = !('vibrate' in navigator);
}
$('soundBtn').onclick = () => {
  settings.sound = !settings.sound;
  if (settings.sound && audio) audio.resume();
  save(); updateButtons();
};
$('vibBtn').onclick = () => {
  settings.vibrate = !settings.vibrate;
  save(); updateButtons();
};
updateButtons();

/* ---------------- Legende mit Filter ---------------- */

function buildLegend() {
  const legend = $('legend');
  for (const [cls, c] of Object.entries(CLASSES)) {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="dot" style="background:${color(cls)}"></span>${c.name}<span class="count" id="count-${cls}"></span>`;
    btn.classList.toggle('off', !isEnabled(cls));
    btn.onclick = () => {
      settings.enabled = isEnabled(cls)
        ? settings.enabled.filter(k => k !== cls)
        : [...settings.enabled, cls];
      btn.classList.toggle('off', !isEnabled(cls));
      blips = blips.filter(b => isEnabled(b.cls));
      save();
    };
    legend.appendChild(btn);
  }
}
buildLegend();

function updateCounts() {
  for (const cls in CLASSES) {
    const n = detections.filter(d => d.cls === cls).length;
    $('count-' + cls).textContent = n || '';
  }
}

/* ---------------- Start ---------------- */

async function start() {
  // Ton und Kompass müssen direkt im Klick freigeschaltet werden
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) { audio = new AC(); audio.resume(); }
  const compassReady = startCompass();

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  await compassReady;
  keepAwake();

  startBtn.hidden = true;
  $('controls').hidden = false;
  $('heading').hidden = false;
  $('legend').hidden = false;
  statusEl.textContent = 'Suche…';
  detectLoop();
  requestAnimationFrame(render);
}
startBtn.onclick = () => start().catch(e => statusEl.textContent = 'Kamera-Fehler: ' + e.message);

// Tippen aufs Radar wechselt die Reichweite
canvas.addEventListener('click', e => {
  if (Math.hypot(e.clientX - radar.x, e.clientY - radar.y) > radar.R) return;
  settings.range = (settings.range + 1) % RANGES.length;
  save();
});

/* ---------------- Erkennung ---------------- */

// Brennweite in Pixeln aus dem angenommenen Blickwinkel der Kamera
function focalLength() {
  const long = Math.max(video.videoWidth, video.videoHeight);
  return (long / 2) / Math.tan(LONG_FOV / 2);
}

// Läuft unabhängig vom Zeichnen, etwa 10× pro Sekunde
async function detectLoop() {
  if (video.readyState >= 2) {
    const preds = await model.detect(video, 20);
    const now = performance.now();
    const vw = video.videoWidth, vh = video.videoHeight;
    const f = focalLength();
    fov = 2 * Math.atan((vw / 2) / f);

    const used = new Set();   // jeder Punkt darf pro Durchlauf nur einem Objekt zugeordnet werden
    const found = [];

    for (const p of preds) {
      if (!CLASSES[p.class] || !isEnabled(p.class) || p.score < MIN_SCORE) continue;
      const cls = p.class;
      const [x, y, w, h] = p.bbox;

      // Winkel zur Blickrichtung -> Himmelsrichtung
      const angle = Math.atan((x + w / 2 - vw / 2) / f);
      const bearing = (heading + angle + TAU) % TAU;
      // Entfernung über die typische Höhe: Abstand = echte Höhe × Brennweite / Höhe im Bild
      const dist = CLASSES[cls].height * f / h;
      // Am oberen/unteren Bildrand abgeschnitten -> in Wahrheit näher als berechnet
      const clipped = y <= 2 || y + h >= vh - 2;

      // Nächstgelegenen bekannten Punkt derselben Art aktualisieren, sonst neuen anlegen
      let blip = null, best = Infinity;
      for (const b of blips) {
        if (used.has(b) || b.cls !== cls) continue;
        const da = Math.abs(wrap(b.bearing - bearing));
        const dd = Math.abs(b.dist - dist) / Math.max(b.dist, dist);
        if (da < 0.15 && dd < 0.4 && da + dd < best) { best = da + dd; blip = b; }
      }
      if (blip) {
        // Leicht glätten, damit die Punkte nicht zittern
        blip.bearing = (blip.bearing + wrap(bearing - blip.bearing) * 0.5 + TAU) % TAU;
        blip.dist += (dist - blip.dist) * 0.4;
      } else {
        blip = { id: nextId++, cls, bearing, dist, lastHit: -1e9 };
        blips.push(blip);
        alertNew(cls);
      }
      used.add(blip);
      blip.clipped = clipped;
      blip.lastSeen = now;
      found.push({ bbox: p.bbox, score: p.score, id: blip.id, cls, dist: blip.dist, clipped });
    }

    detections = found;
    detectionsTime = now;

    // Im Sichtfeld verschwundene Objekte schnell entfernen,
    // Objekte außerhalb des Sichtfelds (z. B. hinter dir) länger merken
    blips = blips.filter(b => {
      const inView = Math.abs(wrap(b.bearing - heading)) < fov / 2;
      return now - b.lastSeen < (inView ? LOST_IN_VIEW : MEMORY_TIME);
    });
    const remembered = blips.length - found.length;
    statusEl.textContent = `Im Blick: ${found.length}` + (remembered > 0 ? ` · Gemerkt: ${remembered}` : '');
    updateCounts();
  }
  setTimeout(detectLoop, 100);
}

/* ---------------- Zeichnen ---------------- */

// Rechnet Videokoordinaten in Bildschirmkoordinaten um (berücksichtigt object-fit: cover)
function videoToScreen() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(canvas.width / vw, canvas.height / vh);
  return {
    scale,
    ox: (canvas.width - vw * scale) / 2,
    oy: (canvas.height - vh * scale) / 2
  };
}

function drawBoxes(now) {
  if (now - detectionsTime > BOX_TIMEOUT || !video.videoWidth) return;
  const { scale, ox, oy } = videoToScreen();

  ctx.font = 'bold 15px sans-serif';
  ctx.textBaseline = 'top';

  for (const d of detections) {
    const [x, y, w, h] = d.bbox;
    const sx = ox + x * scale, sy = oy + y * scale;
    const sw = w * scale, sh = h * scale;
    const col = color(d.cls);

    // Rahmen
    ctx.lineWidth = 3;
    ctx.strokeStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 8;
    ctx.strokeRect(sx, sy, sw, sh);
    ctx.shadowBlur = 0;

    // Ecken-Markierungen im Zielerfassungs-Stil
    const c = Math.min(24, sw / 4, sh / 4);
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(sx, sy + c); ctx.lineTo(sx, sy); ctx.lineTo(sx + c, sy);
    ctx.moveTo(sx + sw - c, sy); ctx.lineTo(sx + sw, sy); ctx.lineTo(sx + sw, sy + c);
    ctx.moveTo(sx, sy + sh - c); ctx.lineTo(sx, sy + sh); ctx.lineTo(sx + c, sy + sh);
    ctx.moveTo(sx + sw - c, sy + sh); ctx.lineTo(sx + sw, sy + sh); ctx.lineTo(sx + sw, sy + sh - c);
    ctx.stroke();

    // Beschriftung: Art, Nummer, Entfernung, Sicherheit
    const label = `${CLASSES[d.cls].name} #${d.id} · ${d.clipped ? '< ' : '≈ '}${fmtDist(d.dist)} · ${Math.round(d.score * 100)}%`;
    const tw = ctx.measureText(label).width + 10;
    const ly = sy > 24 ? sy - 24 : sy;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(sx, ly, tw, 22);
    ctx.fillStyle = col;
    ctx.fillText(label, sx + 5, ly + 4);
  }
}

function drawRadar(now) {
  const { x: rx, y: ry, R } = radar;
  const range = RANGES[settings.range];

  ctx.fillStyle = 'rgba(0, 25, 0, 0.6)';
  ctx.beginPath();
  ctx.arc(rx, ry, R, 0, TAU);
  ctx.fill();

  // Entfernungsringe mit Beschriftung
  ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  for (const f of [0.25, 0.5, 0.75, 1]) {
    ctx.beginPath();
    ctx.arc(rx, ry, R * f, 0, TAU);
    ctx.stroke();
    if (f < 1) {
      ctx.fillStyle = 'rgba(0, 255, 0, 0.7)';
      ctx.fillText(`${range * f} m`, rx + 3, ry - R * f - 1);
    }
  }
  ctx.font = 'bold 11px sans-serif';
  ctx.fillStyle = '#0f0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(`${range} m`, rx, ry + R + 3);

  // Himmelsrichtungen drehen sich mit, oben ist immer die Blickrichtung
  if (hasCompass) {
    ctx.font = 'bold 13px sans-serif';
    ctx.textBaseline = 'middle';
    [['N', 0], ['O', Math.PI / 2], ['S', Math.PI], ['W', -Math.PI / 2]].forEach(([l, a]) => {
      const rel = a - heading;
      ctx.fillStyle = l === 'N' ? '#f44' : 'rgba(0, 255, 0, 0.8)';
      ctx.fillText(l, rx + Math.sin(rel) * (R - 10), ry - Math.cos(rel) * (R - 10));
    });
  }
  ctx.textAlign = 'start';

  // Sichtfeld der Kamera als Kegel
  ctx.fillStyle = 'rgba(0, 255, 0, 0.08)';
  ctx.beginPath();
  ctx.moveTo(rx, ry);
  ctx.arc(rx, ry, R, -Math.PI / 2 - fov / 2, -Math.PI / 2 + fov / 2);
  ctx.closePath();
  ctx.fill();

  // Radarstrahl mit Nachleuchten (0 = oben = Blickrichtung der Kamera)
  for (let i = 0; i < 12; i++) {
    const a = sweep - i * 0.04;
    ctx.strokeStyle = `rgba(0, 255, 0, ${0.9 * (1 - i / 12)})`;
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx + Math.sin(a) * R, ry - Math.cos(a) * R);
    ctx.stroke();
  }

  // Objekte als Punkte
  ctx.font = '11px sans-serif';
  ctx.textBaseline = 'middle';
  for (const b of blips) {
    const rel = wrap(b.bearing - heading);

    // Trifft der Strahl das Objekt?
    if (Math.abs(wrap(sweep - rel)) < 0.08 && now - b.lastHit > 500) {
      b.lastHit = now;
      sweepPing(b.dist);
    }

    const age = (now - b.lastHit) / 1000;
    if (age >= FADE_TIME) continue;

    // Gemerkte Objekte (nicht mehr im Bild) werden blasser und hohl gezeichnet
    const live = now - b.lastSeen < BOX_TIMEOUT;
    const memory = live ? 1 : Math.max(0.25, 1 - (now - b.lastSeen) / MEMORY_TIME);
    const alpha = (1 - age / FADE_TIME) * memory;

    // Außerhalb der Reichweite: am Rand als Pfeil-Punkt
    const outside = b.dist > range;
    const r = R * Math.min(1, b.dist / range) * (outside ? 0.97 : 1);
    const x = rx + Math.sin(rel) * r;
    const y = ry - Math.cos(rel) * r;
    ctx.fillStyle = ctx.strokeStyle = color(b.cls, alpha);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, outside ? 4 : 6, 0, TAU);
    if (live) ctx.fill(); else ctx.stroke();
    ctx.fillText('#' + b.id, x + 9, y);
  }
}

function render() {
  const now = performance.now();
  const dt = (now - lastFrame) / 1000;
  lastFrame = now;
  sweep = (sweep + SWEEP_SPEED * dt) % TAU;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBoxes(now);

  // Radar in der unteren rechten Ecke (mit Abstand zu Notch/Home-Leiste)
  const safe = getComputedStyle($('safe'));
  const R = Math.min(canvas.width, canvas.height) * 0.3;
  radar = {
    R,
    x: canvas.width - R - 20 - parseFloat(safe.paddingRight),
    y: canvas.height - R - 32 - parseFloat(safe.paddingBottom)
  };
  drawRadar(now);

  headingEl.textContent = hasCompass ? `🧭 ${headingText()}` : '🧭 kein Kompass';

  requestAnimationFrame(render);
}

init();
</script>
</body>
</html>
